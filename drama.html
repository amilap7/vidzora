<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vidzora - Drama</title>
<meta name="description" content="Watch K-Dramas and episodes on Vidzora.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08080b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

a{
    color:inherit;
    text-decoration:none;
}

.header{
    height:68px;
    background:#0d0d11;
    border-bottom:1px solid #24242b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:#ff1744;
}

.home-btn{
    background:#18181e;
    border:1px solid #303039;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
    font-weight:700;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.hero{
    min-height:360px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#111;
    display:flex;
    align-items:flex-end;
    margin-bottom:25px;
}

.hero-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.45;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        #08080b 5%,
        rgba(8,8,11,.72) 45%,
        rgba(8,8,11,.15)
    );
}

.hero-content{
    position:relative;
    z-index:2;
    padding:28px;
    width:100%;
}

.poster{
    width:150px;
    height:215px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #333;
    box-shadow:0 10px 35px rgba(0,0,0,.6);
    float:left;
    margin-right:22px;
    margin-bottom:12px;
}

.drama-title{
    font-size:34px;
    font-weight:900;
    margin-bottom:10px;
}

.meta{
    color:#bbb;
    margin-bottom:12px;
    line-height:1.7;
}

.badge{
    display:inline-block;
    background:#ff1744;
    color:#fff;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
    margin-right:6px;
}

.description{
    color:#ddd;
    line-height:1.6;
    max-width:700px;
}

.clear{
    clear:both;
}

.section-title{
    font-size:24px;
    margin:28px 0 15px;
}

.gate{
    background:#111116;
    border:1px solid #2b2b33;
    border-radius:18px;
    padding:25px;
    text-align:center;
    max-width:600px;
    margin:25px auto;
}

.lock{
    font-size:45px;
    margin-bottom:10px;
}

.gate h2{
    margin-bottom:8px;
}

.gate p{
    color:#aaa;
    line-height:1.5;
    margin-bottom:18px;
}

.password-box{
    width:100%;
    padding:14px;
    background:#09090c;
    color:#fff;
    border:1px solid #383842;
    border-radius:10px;
    outline:none;
    font-size:16px;
    margin-bottom:10px;
}

.password-box:focus{
    border-color:#ff1744;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    margin-top:8px;
}

.youtube-btn{
    background:#ff1744;
    color:#fff;
}

.unlock-btn{
    background:#fff;
    color:#08080b;
}

.error{
    color:#ff526f;
    font-size:14px;
    margin-top:12px;
    display:none;
}

.ad-note{
    font-size:12px;
    color:#777;
    margin-top:10px;
}

.episodes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.episode{
    background:#111116;
    border:1px solid #27272e;
    border-radius:14px;
    overflow:hidden;
}

.episode-img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#19191f;
}

.episode-body{
    padding:13px;
}

.episode-title{
    font-size:16px;
    font-weight:800;
    margin-bottom:6px;
}

.episode-meta{
    color:#888;
    font-size:13px;
    margin-bottom:12px;
}

.watch-btn{
    display:block;
    text-align:center;
    background:#ff1744;
    padding:11px;
    border-radius:9px;
    font-weight:800;
    cursor:pointer;
}

.empty{
    background:#111116;
    border:1px solid #292930;
    padding:25px;
    border-radius:14px;
    color:#aaa;
    text-align:center;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:50px 10px;
}

.hidden{
    display:none !important;
}

footer{
    border-top:1px solid #222229;
    margin-top:45px;
    padding:25px;
    text-align:center;
    color:#666;
    font-size:13px;
}

@media(max-width:700px){

    .container{
        padding:14px;
    }

    .hero{
        min-height:440px;
    }

    .hero-content{
        padding:20px;
    }

    .poster{
        float:none;
        display:block;
        width:130px;
        height:185px;
        margin:0 auto 18px;
    }

    .drama-title{
        text-align:center;
        font-size:27px;
    }

    .meta{
        text-align:center;
    }

    .description{
        text-align:center;
    }

    .episodes{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
}

@media(max-width:430px){

    .logo{
        font-size:24px;
    }

    .home-btn{
        padding:8px 11px;
        font-size:13px;
    }

    .episodes{
        grid-template-columns:1fr 1fr;
    }

    .episode-body{
        padding:10px;
    }

    .episode-title{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">
        Vid<span>zora</span>
    </a>

    <a href="index.html" class="home-btn">
        ← Home
    </a>
</header>

<main class="container">

    <div id="loading" class="loading">
        Loading drama...
    </div>

    <section id="content" class="hidden">

        <div class="hero">

            <img id="banner" class="hero-bg" src="" alt="">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <img id="poster" class="poster" src="" alt="">

                <h1 id="title" class="drama-title"></h1>

                <div id="meta" class="meta"></div>

                <p id="description" class="description"></p>

                <div class="clear"></div>

            </div>
        </div>

        <!-- PASSWORD GATE -->
        <section id="passwordGate" class="gate">

            <div class="lock">🔐</div>

            <h2>Unlock This Drama</h2>

            <p>
                Watch the password video on YouTube and enter
                the drama password below to unlock all episodes.
            </p>

            <button
                id="youtubeBtn"
                class="btn youtube-btn"
                onclick="getPasswordVideo()">
                ▶ Get Password on YouTube
            </button>

            <input
                id="password"
                class="password-box"
                type="password"
                placeholder="Enter drama password"
                autocomplete="off">

            <button
                class="btn unlock-btn"
                onclick="unlockDrama()">
                🔓 Unlock Episodes
            </button>

            <div id="error" class="error">
                Incorrect password. Please try again.
            </div>

            <div class="ad-note">
                Password is required to access episodes.
            </div>

        </section>

        <!-- EPISODES -->
        <section id="episodeSection" class="hidden">

            <h2 class="section-title">
                Episodes
            </h2>

            <div id="episodes" class="episodes"></div>

        </section>

    </section>

    <div id="notFound" class="empty hidden">
        Drama not found.
    </div>

</main>

<footer>
    © 2026 Vidzora. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ============================
   SUPABASE
============================ */

const SUPABASE_URL = "https://qcqdduvrhqipcuqhlrhs.supabase.co";
const SUPABASE_KEY = "sb_publishable_u2Cf_WlnX6jK6YuxNYuK9g_rYHpDo8o";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================
   GET DRAMA ID
============================ */

const params = new URLSearchParams(
    window.location.search
);

const dramaId = params.get("id");

let drama = null;
let episodes = [];


/* ============================
   ESCAPE HTML
============================ */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ============================
   GET AD SMARTLINK
============================ */

async function getAd(adName){

    try{

        const { data, error } =
            await supabaseClient
            .from("ads")
            .select("smartlink_url,enabled")
            .eq("ad_name",adName)
            .eq("enabled",true)
            .maybeSingle();

        if(error){
            console.log("Ad error:",error);
            return null;
        }

        if(!data || !data.smartlink_url){
            return null;
        }

        return data.smartlink_url;

    }catch(error){

        console.log(error);
        return null;
    }
}


/* ============================
   OPEN AD
============================ */

async function openAd(adName){

    const url = await getAd(adName);

    if(!url){
        return;
    }

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* ============================
   LOAD DRAMA
============================ */

async function loadDrama(){

    if(!dramaId){

        showNotFound();
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("dramas")
        .select(`
            id,
            title,
            poster,
            banner,
            description,
            genre,
            year,
            status,
            featured,
            trending,
            password_youtube_url
        `)
        .eq("id",dramaId)
        .single();

    if(error || !data){

        console.log(error);
        showNotFound();
        return;
    }

    drama = data;

    document.title =
        drama.title + " - Vidzora";

    document.getElementById("title").textContent =
        drama.title || "Untitled Drama";

    document.getElementById("poster").src =
        drama.poster || "";

    document.getElementById("banner").src =
        drama.banner || drama.poster || "";

    document.getElementById("description").textContent =
        drama.description || "Watch this K-Drama on Vidzora.";

    let meta = "";

    if(drama.year){
        meta += `<span class="badge">${escapeHtml(drama.year)}</span>`;
    }

    if(drama.genre){
        meta += `<span class="badge">${escapeHtml(drama.genre)}</span>`;
    }

    if(drama.status){
        meta += `<span class="badge">${escapeHtml(drama.status)}</span>`;
    }

    document.getElementById("meta").innerHTML = meta;

    document.getElementById("loading")
        .classList.add("hidden");

    document.getElementById("content")
        .classList.remove("hidden");
}


/* ============================
   PASSWORD VIDEO
============================ */

async function getPasswordVideo(){

    if(!drama || !drama.password_youtube_url){
        alert("Password video is not available yet.");
        return;
    }

    /*
       ADS-02
       Opens configured Monetag SmartLink if available.
    */

    await openAd("ADS-02");

    setTimeout(function(){

        window.open(
            drama.password_youtube_url,
            "_blank",
            "noopener,noreferrer"
        );

    },300);

}


/* ============================
   UNLOCK DRAMA
============================ */

async function unlockDrama(){

    const password =
        document.getElementById("password")
        .value
        .trim();

    const errorBox =
        document.getElementById("error");

    errorBox.style.display = "none";

    if(!password){

        errorBox.textContent =
            "Please enter the password.";

        errorBox.style.display = "block";

        return;
    }

    try{

        const { data, error } =
            await supabaseClient.rpc(
                "verify_drama_password",
                {
                    p_drama_id: Number(dramaId),
                    p_password: password
                }
            );

        if(error){

            console.log(error);

            errorBox.textContent =
                "Unable to verify password.";

            errorBox.style.display = "block";

            return;
        }

        if(data === true){

            /*
               ADS-01
               Drama password unlock.
            */

            await openAd("ADS-01");

            document.getElementById("passwordGate")
                .classList.add("hidden");

            document.getElementById("episodeSection")
                .classList.remove("hidden");

            loadEpisodes();

        }else{

            errorBox.textContent =
                "Incorrect password. Please try again.";

            errorBox.style.display = "block";
        }

    }catch(error){

        console.log(error);

        errorBox.textContent =
            "Something went wrong. Please try again.";

        errorBox.style.display = "block";
    }
}


/* ============================
   LOAD EPISODES
============================ */

async function loadEpisodes(){

    const { data, error } =
        await supabaseClient
        .from("episodes")
        .select(`
            id,
            drama_id,
            episode_number,
            title,
            thumbnail,
            video_url,
            duration,
            description
        `)
        .eq("drama_id",Number(dramaId))
        .order("episode_number",{ascending:true});

    if(error){

        console.log(error);

        document.getElementById("episodes")
            .innerHTML =
            `<div class="empty">
                Unable to load episodes.
             </div>`;

        return;
    }

    episodes = data || [];

    renderEpisodes();
}


/* ============================
   RENDER EPISODES
============================ */

function renderEpisodes(){

    const box =
        document.getElementById("episodes");

    if(!episodes.length){

        box.innerHTML =
            `<div class="empty">
                No episodes available yet.
             </div>`;

        return;
    }

    box.innerHTML =
        episodes.map(function(ep){

            const number =
                ep.episode_number
                ? "Episode " + ep.episode_number
                : "Episode";

            const title =
                ep.title ||
                number;

            const thumbnail =
                ep.thumbnail ||
                drama.poster ||
                "";

            const duration =
                ep.duration ||
                "";

            return `
                <article class="episode">

                    <img
                        class="episode-img"
                        src="${escapeHtml(thumbnail)}"
                        alt="${escapeHtml(title)}"
                        loading="lazy">

                    <div class="episode-body">

                        <div class="episode-title">
                            ${escapeHtml(title)}
                        </div>

                        <div class="episode-meta">
                            ${escapeHtml(number)}
                            ${duration ? " • " + escapeHtml(duration) : ""}
                        </div>

                        <div
                            class="watch-btn"
                            onclick="watchEpisode(${Number(ep.id)})">
                            ▶ Watch
                        </div>

                    </div>

                </article>
            `;

        }).join("");
}


/* ============================
   WATCH EPISODE
============================ */

async function watchEpisode(id){

    const episode =
        episodes.find(function(item){
            return Number(item.id) === Number(id);
        });

    if(!episode || !episode.video_url){
        alert("Video is not available.");
        return;
    }

    /*
       ADS-03
       Episode page/watch action.
    */

    await openAd("ADS-03");

    /*
       Small delay so the ad can open first.
    */

    setTimeout(function(){

        /*
           ADS-04
           Watch Video action.
        */

        openAd("ADS-04");

        setTimeout(function(){

            window.open(
                episode.video_url,
                "_blank",
                "noopener,noreferrer"
            );

        },300);

    },300);

}


/* ============================
   NOT FOUND
============================ */

function showNotFound(){

    document.getElementById("loading")
        .classList.add("hidden");

    document.getElementById("content")
        .classList.add("hidden");

    document.getElementById("notFound")
        .classList.remove("hidden");
}


/* ============================
   ENTER KEY
============================ */

document.getElementById("password")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){
            unlockDrama();
        }

    });


/* ============================
   START
============================ */

loadDrama();

</script>

</body>
</html>
